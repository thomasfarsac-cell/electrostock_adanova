<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - {{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container narrow">
    <section class="card login-card">
        <h1>Connexion</h1>
        <p class="muted">Connecte-toi avec ton pseudo / nom d'utilisateur.</p>
        {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
        <form method="post" action="/login" class="stack-form">
            <input type="hidden" name="next" value="{{ next or '/' }}">
            <label>Pseudo / utilisateur
                <input type="text" name="username" value="{{ username or 'admin' }}" required>
            </label>
            <label>Mot de passe
                <input type="password" name="password" required autofocus>
            </label>
            <button class="btn" type="submit">Connexion</button>
        </form>
        <div class="reset-box">
            <strong>Mot de passe oublie :</strong>
            <p>Demande a un administrateur de le reinitialiser depuis la page Utilisateurs.</p>
        </div>
    </section>
</main>
</body>
</html>
